name: Ymmo CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Mise à jour vers la v4 (utilise le moteur Node.js récent)
    - name: Récupération du code
      uses: actions/checkout@v4

    # Mise à jour vers la v5
    - name: Configuration de Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f dev/backend/requirements.txt ]; then pip install -r dev/backend/requirements.txt; fi

    - name: Linting avec flake8 (Vérification de la propreté du code)
      run: |
        flake8 dev/backend --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Tests unitaires avec pytest
      run: |
        PYTHONPATH=dev/backend pytest dev/backend/